# Adds LaTeX/lualatex support for OTOBO processes that generate PDF
# documents (quotes/invoices) via LaTeX.
#
# TeX Live is NOT baked into the otobo image. Instead a separate, rarely
# rebuilt provider image (https://github.com/RotherOSS/otobo-texlive-provider)
# copies a self-contained, relocatable upstream TeX Live tree into a
# volume. The web/daemon containers mount that volume at /opt/texlive -
# the *same* path it was built for - so no path overrides are needed.
# This keeps the nightly-built otobo image small; only installations that
# actually need LaTeX add this file to COMPOSE_FILE.
#
# See also README.md.

services:

  # Runs once, copies TeX Live into the shared volume, then exits.
  texlive-init:
    image: ${OTOBO_IMAGE_TEXLIVE:-rotheross/otobo-texlive-provider:latest}
    restart: "no"
    volumes:
      - texlive_data:/target

  web:
    depends_on:
      texlive-init:
        condition: service_completed_successfully
    volumes:
      - texlive_data:/opt/texlive:ro
    environment:
      # Absolute path to the binary (bin/current is an architecture-
      # independent symlink created by the provider image).
      OTOBO_LUALATEX_BIN: /opt/texlive/bin/current/lualatex
      # The tree is mounted read-only, but luaotfload needs a writable
      # location for its font caches (glyph data of the custom fonts is
      # cached on first use). Everything pre-built at image build time
      # (lualatex.fmt, font name database) is still found in the
      # read-only tree via TEXMFSYSVAR; this only adds a writable layer.
      TEXMFVAR: /opt/otobo/var/tmp/texlive-var

  # Only needed if the process can also run asynchronously via the daemon
  # (e.g. a Generic Agent Job or event-based ticket process), not just
  # synchronously within a web request. Remove this block if not needed.
  daemon:
    depends_on:
      texlive-init:
        condition: service_completed_successfully
    volumes:
      - texlive_data:/opt/texlive:ro
    environment:
      OTOBO_LUALATEX_BIN: /opt/texlive/bin/current/lualatex
      TEXMFVAR: /opt/otobo/var/tmp/texlive-var

volumes:
  texlive_data: {}
